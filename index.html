<!-- https://github.com/ram133/guamcoin -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuamCoin Explorer</title>
  <style>
    :root {
      --bg-color: #0b1329;
      --card-bg: #16223f;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border: #1e293b;
      --success: #22c55e;
      --danger: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 1.5rem;
      margin: 0;
      line-height: 1.5;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin: 0 0 0.5rem 0;
      color: var(--text-main);
      letter-spacing: -0.025em;
    }
    .note {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin: 0;
    }
    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      display: none;
      font-size: 0.9rem;
    }
    .search-global {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 1.5rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-global:focus {
      border-color: var(--accent);
    }
    .tab-menu {
      display: flex;
      gap: 6px;
      margin-bottom: 1.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: thin;
    }
    .tab-menu::-webkit-scrollbar {
      height: 6px;
    }
    .tab-menu::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    .tab-menu button {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      border-radius: 6px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-menu button:hover {
      background: var(--border);
      color: var(--text-main);
    }
    .tab-menu button.active {
      background: var(--accent);
      color: var(--bg-color);
      border-color: var(--accent);
    }
    .tab-content {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }
    .tab-content.active {
      display: block;
    }
    input.searchInput {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 1rem;
      outline: none;
    }
    input.searchInput:focus {
      border-color: var(--accent);
    }
    ul.numberList {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    ul.numberList li {
      padding: 0.75rem 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    ul.numberList li:last-child {
      border-bottom: none;
    }
    .phone-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .phone-number {
      font-weight: 600;
      font-size: 1rem;
    }
    .coins { 
      color: var(--success); 
      font-weight: 700; 
      font-size: 1rem;
    }
    .history { 
      display: block; 
      color: var(--text-muted); 
      font-size: 0.8rem; 
    }
    .wallet-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .wallet-actions button { 
      padding: 0.4rem 0.75rem; 
      font-size: 0.85rem; 
      font-weight: 600;
      cursor: pointer; 
      background: var(--accent);
      color: var(--bg-color);
      border: none;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .wallet-actions button:hover {
      background: var(--accent-hover);
    }
    .pagination {
      display: flex;
      gap: 4px;
      justify-content: center;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    .pagination button { 
      padding: 0.4rem 0.75rem; 
      font-size: 0.85rem; 
      cursor: pointer; 
      background: var(--bg-color);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .pagination button.active {
      background: var(--accent);
      color: var(--bg-color);
      border-color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>GuamCoin Explorer</h1>
      <p class="note" id="storageNote">Decentralized public ledger built on ram133/guamcoin</p>
    </header>
    
    <div id="errorBanner" class="error-banner"></div>
    <input type="text" class="search-global" id="globalSearch" placeholder="Global search any 10-digit 671 phone number..." />
    <div class="tab-menu" id="tabButtons"></div>
    <div id="tabContainer"></div>
  </main>
  
  <script>
    var OWNER = 'ram133';
    var REPO = 'guamcoin';
    var BRANCH = 'main';
    var prefixes = [456, 678, 682, 683, 685, 686, 687, 688, 689, 707, 726, 727, 747, 777, 787, 788, 797, 838, 848, 858, 868, 878, 888, 898, 922, 929, 967, 969, 971, 972, 977, 979, 987, 988, 989, 991, 996, 997, 998, 999];
    var total = 9999;
    var perPage = 100;
    var tabButtonsDiv = document.getElementById('tabButtons');
    var tabContainer = document.getElementById('tabContainer');
    var overrides = {};
    var currentPage = {};
    var busy = {};
    var activePrefix = prefixes[0];

    function showError(msg) {
      var banner = document.getElementById('errorBanner');
      if (msg) {
        banner.textContent = msg;
        banner.style.display = 'block';
      } else {
        banner.style.display = 'none';
      }
    }
    function rawUrl(prefix) {
      return 'https://raw.githubusercontent.com/' + OWNER + '/' + REPO + '/' + BRANCH + '/balances/' + prefix + '.json?t=' + Date.now();
    }
    function apiUrl(prefix) {
      return 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/balances/' + prefix + '.json';
    }
    function token() {
      return atob("Z2hwX1BuMllhc2ZHWVBRYW1wUG9JTjNJdnB0ZExibVhlZjJoc1hrdA==").trim();
    }
    function phoneAt(prefix, index) {
      return String(671) + String(prefix) + ('0000' + index).slice(-4);
    }
    function prefixOf(phone) {
      return phone.slice(3, 6);
    }
    function entryAt(prefix, index) {
      var phone = phoneAt(prefix, index);
      var saved = overrides[prefix] && overrides[prefix][phone];
      return {
        phone: phone,
        coins: saved ? saved.coins : 100,
        history: saved && saved.history ? saved.history : []
      };
    }
    function loadOverrides(prefix, done) {
      fetch(rawUrl(prefix))
        .then(function (r) { return r.ok ? r.json() : {}; })
        .then(function (data) { done(data || {}); })
        .catch(function () { done({}); });
    }
    function createTab(prefix) {
      var btn = document.createElement('button');
      btn.textContent = '671-' + prefix;
      btn.setAttribute('data-prefix', prefix);
      tabButtonsDiv.appendChild(btn);
      var wrapper = document.createElement('div');
      wrapper.className = 'tab-content';
      wrapper.id = 'tab-' + prefix;
      wrapper.innerHTML = '<input type="text" class="searchInput" id="search-' + prefix + '" placeholder="Filter prefix ' + prefix + '..." /><ul class="numberList" id="list-' + prefix + '"></ul><div class="pagination" id="pagination-' + prefix + '"></div>';
      tabContainer.appendChild(wrapper);
    }
    function showTab(p) {
      activePrefix = p;
      var tabs = document.querySelectorAll('.tab-content');
      var buttons = document.querySelectorAll('.tab-menu button');
      var i;
      for (i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
      for (i = 0; i < buttons.length; i++) buttons[i].classList.remove('active');
      
      var targetTab = document.getElementById('tab-' + p);
      if (targetTab) targetTab.classList.add('active');
      
      for (i = 0; i < buttons.length; i++) {
        if (buttons[i].getAttribute('data-prefix') == String(p)) buttons[i].classList.add('active');
      }
      renderPage(p, currentPage[p] || 1);
    }
    function readFile(prefix, key) {
      return fetch(apiUrl(prefix), { headers: { Authorization: 'token ' + key, Accept: 'application/vnd.github+json' } })
        .then(function (r) {
          if (r.status === 401 || r.status === 403) throw new Error('GitHub Authentication failed (401/403).');
          if (r.status === 404) return { missing: true, sha: null, data: {} };
          if (!r.ok) return r.text().then(function(t) { throw new Error('Read failed (' + r.status + '): ' + t); });
          return r.json().then(function(file) {
            var data = {};
            if (file.content) data = JSON.parse(atob(file.content.replace(/\n/g, '')));
            return { missing: false, sha: file.sha, data: data };
          });
        });
    }
    function writeFile(prefix, key, data, sha, message) {
      var bodyObj = { message: message, content: btoa(JSON.stringify(data)), branch: BRANCH };
      if (sha) bodyObj.sha = sha;
      return fetch(apiUrl(prefix), {
        method: 'PUT',
        headers: { Authorization: 'token ' + key, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(bodyObj)
      }).then(function (r) {
        if (r.status === 401 || r.status === 403) throw new Error('GitHub Authentication failed (401/403).');
        if (!r.ok) return r.text().then(function(t) { throw new Error('Write failed (' + r.status + '): ' + t); });
        return r.json();
      }).then(function(res) {
        overrides[prefix] = data;
        showError(null);
        return res;
      });
    }
    function rowFor(data, phone) {
      var row = data[phone] || { coins: 100, history: [] };
      if (!row.history) row.history = [];
      return row;
    }
    function sendCoins(prefix, phone) {
      if (busy[prefix]) return;
      var key = token();
      if (!overrides[prefix]) overrides[prefix] = {};
      var dest = prompt('Enter 10-digit destination phone starting with 671:');
      if (!dest || dest === phone || prefixOf(dest).length !== 3) { alert('Invalid destination number.'); return; }
      busy[prefix] = true;
      var destPrefix = prefixOf(dest);
      
      var destPrefixNum = parseInt(destPrefix, 10);
      if (prefixes.indexOf(destPrefixNum) === -1) {
        alert('Destination prefix ' + destPrefix + ' is not supported.');
        busy[prefix] = false;
        return;
      }

      readFile(prefix, key).then(function (srcFile) {
        var src = rowFor(srcFile.data, phone);
        if (src.coins < 10) throw new Error('Not enough coins (minimum 10 required).');
        src.coins -= 10;
        src.history.push({ delta: -10, reason: 'send', to: dest, at: new Date().toISOString(), balance: src.coins });
        srcFile.data[phone] = src;
        
        if (destPrefix === String(prefix)) {
          var dst = rowFor(srcFile.data, dest);
          dst.coins += 10;
          dst.history.push({ delta: 10, reason: 'receive', from: phone, at: new Date().toISOString(), balance: dst.coins });
          srcFile.data[dest] = dst;
          return writeFile(prefix, key, srcFile.data, srcFile.sha, phone + ' send 10 to ' + dest);
        }
        return writeFile(prefix, key, srcFile.data, srcFile.sha, phone + ' send 10 to ' + dest).then(function () {
          return readFile(destPrefix, key).then(function (dstFile) {
            var dst = rowFor(dstFile.data, dest);
            dst.coins += 10;
            dst.history.push({ delta: 10, reason: 'receive', from: phone, at: new Date().toISOString(), balance: dst.coins });
            dstFile.data[dest] = dst;
            return writeFile(destPrefix, key, dstFile.data, dstFile.sha, dest + ' receive 10 from ' + phone);
          });
        });
      }).then(function () {
        renderPage(prefix, currentPage[prefix] || 1);
        alert('Successfully transferred 10 GuamCoins to ' + dest);
      }).catch(function (err) {
        var msg = 'Transfer failed: ' + (err && err.message ? err.message : 'Check balance.');
        showError(msg);
        alert(msg);
      }).then(function () { busy[prefix] = false; });
    }
    function matches(phone, filterVal) {
      return !filterVal || phone.indexOf(filterVal) !== -1;
    }
    function renderPage(prefix, page) {
      currentPage[prefix] = page;
      var input = document.getElementById('search-' + prefix);
      var filterVal = input ? input.value.trim() : '';
      var list = document.getElementById('list-' + prefix);
      if (!list) return;
      list.innerHTML = '';
      
      var indexes = [];
      var i;
      for (i = 0; i < total; i++) {
        if (matches(phoneAt(prefix, i), filterVal)) indexes.push(i);
      }
      var pages = Math.max(1, Math.ceil(indexes.length / perPage));
      if (page < 1) page = 1;
      if (page > pages) page = pages;
      
      var sliced = indexes.slice((page - 1) * perPage, page * perPage);
      for (i = 0; i < sliced.length; i++) {
        var item = entryAt(prefix, sliced[i]);
        var last = item.history.length ? item.history[item.history.length - 1] : null;
        var lastText = last ? '<span class="history">Last: ' + last.reason + ' ' + last.delta + ' (' + new Date(last.at).toLocaleTimeString() + ')</span>' : '<span class="history">No recent activity</span>';
        
        var formattedPhone = item.phone.slice(0,3) + '-' + item.phone.slice(3,6) + '-' + item.phone.slice(6);
        
        var li = document.createElement('li');
        li.innerHTML = '<div class="phone-info"><span class="phone-number">' + formattedPhone + '</span>' + lastText + '</div>' +
                       '<div class="wallet-right"><span class="coins">' + item.coins + ' GC</span>' +
                       '<div class="wallet-actions"><button data-action="send" data-phone="' + item.phone + '" data-prefix="' + prefix + '">Send 10</button></div></div>';
        list.appendChild(li);
      }
      renderPagination(prefix, indexes.length, page);
    }
    function renderPagination(prefix, length, activePage) {
      var container = document.getElementById('pagination-' + prefix);
      if (!container) return;
      container.innerHTML = '';
      var pages = Math.max(1, Math.ceil(length / perPage));
      
      var maxButtons = 7;
      var startPage = Math.max(1, activePage - Math.floor(maxButtons / 2));
      var endPage = Math.min(pages, startPage + maxButtons - 1);
      
      if (endPage - startPage + 1 < maxButtons) {
        startPage = Math.max(1, endPage - maxButtons + 1);
      }

      var i;
      for (i = startPage; i <= endPage; i++) {
        var btn = document.createElement('button');
        btn.textContent = i;
        if (i === activePage) btn.className = 'active';
        (function(n) {
          btn.onclick = function() { renderPage(prefix, n); };
        })(i);
        container.appendChild(btn);
      }
    }
    function init() {
      var pending = prefixes.length;
      var p;
      for (p = 0; p < prefixes.length; p++) {
        (function (prefix) {
          createTab(prefix);
          var searchInput = document.getElementById('search-' + prefix);
          if (searchInput) {
            searchInput.oninput = function () { renderPage(prefix, 1); };
          }
          loadOverrides(prefix, function (data) {
            overrides[prefix] = data;
            pending -= 1;
            if (pending === 0) showTab(prefixes[0]);
          });
        })(prefixes[p]);
      }
      
      tabButtonsDiv.onclick = function (e) {
        var t = e.target || e.srcElement;
        if (t && t.tagName === 'BUTTON') {
          showTab(t.getAttribute('data-prefix'));
        }
      };
      
      tabContainer.onclick = function (e) {
        var t = e.target || e.srcElement;
        if (!t || t.tagName !== 'BUTTON') return;
        var action = t.getAttribute('data-action');
        if (action === 'send') {
          sendCoins(t.getAttribute('data-prefix'), t.getAttribute('data-phone'));
        }
      };

      var globalSearch = document.getElementById('globalSearch');
      if (globalSearch) {
        globalSearch.oninput = function() {
          var val = globalSearch.value.trim();
          if (val.length >= 6) {
            var potentialPrefix = val.slice(3, 6);
            if (prefixes.indexOf(parseInt(potentialPrefix, 10)) !== -1) {
              showTab(potentialPrefix);
              var searchInput = document.getElementById('search-' + potentialPrefix);
              if (searchInput) {
                searchInput.value = val;
                renderPage(potentialPrefix, 1);
              }
            }
          }
        };
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  </script>
</body>
</html>
