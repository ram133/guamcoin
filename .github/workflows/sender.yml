name: Automated Number Logger

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-sender:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run sender script
        run: python3 sender.py

      - name: Commit and push log updates
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add sender.py contact_log.txt .github/workflows/sender.yml
          git diff --quiet && git diff --cached --quiet || (git commit -m "Add automated sender and workflow [skip ci]" && git push)
