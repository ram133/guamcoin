name: Hourly Sender and Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Sender
        run: python3 sender.py

      - name: Run Tracker
        run: python3 tracker.py

      - name: Sync Metrics and State
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add metrics.json contact_log.txt
          git diff --quiet && git diff --cached --quiet || (git commit -m "Automated metrics and log sync [skip ci]" && git push)
